plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.sonarqube' version '5.1.0.4882'
}

group = 'de.schlaftagebuch'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation "ca.uhn.hapi.fhir:hapi-fhir-spring-boot-starter:8.6.0"
    implementation "ca.uhn.hapi.fhir:hapi-fhir-structures-r4:8.6.0"
    implementation "ca.uhn.hapi.fhir:hapi-fhir-server:8.6.0"

    implementation 'com.github.librepdf:openpdf:1.3.30'
    implementation 'org.jfree:jfreechart:1.5.4'

}

tasks.named('test') {
    useJUnitPlatform()
}

sonarqube {
    properties {
        property 'sonar.projectKey', System.getenv('SONAR_PROJECT_KEY_BACKEND') ?: 'swp-25-26-groupe-a-backend'
        property 'sonar.host.url', System.getenv('SONAR_HOST_URL')
        property 'sonar.token', System.getenv('SONAR_TOKEN')
        property 'sonar.java.binaries', "${buildDir}/classes/java/main"
    }
}
