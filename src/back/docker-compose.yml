services:
  db:
    image: postgres:16
    container_name: schlaftagebuch-db
    environment:
      POSTGRES_DB: schlaftagebuch
      POSTGRES_USER: schlaf
      POSTGRES_PASSWORD: schlaf
    ports:
      - "5433:5432"
    volumes:
      - schlaf_pgdata:/var/lib/postgresql/data

volumes:
  schlaf_pgdata: