spring.application.name=schlaftagebuch-backend

# JWT
app.jwt.secret=PUT_A_VERY_LONG_RANDOM_SECRET_HERE_AT_LEAST_64_CHARS_ABCDEFGHIJKLMNOPQRSTUVWXYZ_0123456789
app.jwt.accessTtlMinutes=20160

# ===========================================
# SERVER KONFIGURATION
# ===========================================
server.port=8080

# ===========================================
# POSTGRESQL DATENBANK
# ===========================================
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/schlaftagebuch
spring.datasource.username=schlaf
spring.datasource.password=schlaf
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================================
# JPA / HIBERNATE
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# SECURITY (war deaktiviert für testen, jetzt klappt nur mit) spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
# ===========================================

# ===========================================
# LOGGING
# ===========================================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.de.schlaftagebuch=DEBUG
logging.level.org.springframework.security=DEBUG
